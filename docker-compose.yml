version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: bigdata-postgres
    environment:
      POSTGRES_USER: itaca
      POSTGRES_PASSWORD: itaca
      POSTGRES_DB: itaca
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-net

volumes:
  postgres-data:

networks:
  bigdata-net:
    driver: bridge